name: Compose CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ssh-signatures:
    name: ssh-signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require verified SSH signatures on every PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          unsigned_commits=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | select(
              (.commit.verification.verified != true) or
              (((.commit.verification.signature // "") | startswith("-----BEGIN SSH SIGNATURE-----")) | not)
            ) | .sha')

          if [[ -n "$unsigned_commits" ]]; then
            echo "Every PR commit must have a verified SSH signature. Invalid commits:"
            printf '%s\n' "$unsigned_commits"
            exit 1
          fi

          echo "Every PR commit has a verified SSH signature."

  compose-tests:
    name: compose-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Run frontend and backend tests
        run: docker compose --profile test run --build --rm tests

      - name: Build the monolithic application image
        run: docker compose build app

      - name: Verify the complete stack
        run: |
          docker compose up -d app
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/web/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Stop Compose services
        if: always()
        run: docker compose down -v
